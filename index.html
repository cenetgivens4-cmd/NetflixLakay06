<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Lakay</title>
    <!-- Icons Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #141414;
            color: #fff;
            padding-bottom: 30px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Animasyon Ouvèti Netflix Lakay */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOutSplash 0.5s ease 2.8s forwards;
        }
        .splash-logo {
            color: #e50914;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            animation: netflixAnim 2.5s forwards;
            white-space: nowrap;
        }
        @keyframes netflixAnim {
            0% { transform: scale(0.6); opacity: 0; filter: blur(10px); }
            40% { transform: scale(1.1); opacity: 1; filter: blur(0); }
            70% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.2); opacity: 1; }
        }
        @keyframes fadeOutSplash {
            to { opacity: 0; visibility: hidden; }
        }

        /* Ekran Who's Watching? ki gen 3 Pwofil sèlman */
        #profile-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #141414;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            transition: opacity 0.5s ease;
        }
        .profile-screen-title {
            font-size: 24px;
            margin-bottom: 30px;
            color: #fff;
            font-weight: 500;
        }
        .profiles-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .profile-card {
            text-align: center;
            cursor: pointer;
            width: 90px;
        }
        .profile-avatar {
            width: 85px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            background-color: #333;
            border: 2px solid transparent;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }
        .profile-card:hover .profile-avatar {
            border-color: #fff;
        }
        .profile-name {
            font-size: 13px;
            color: #aaa;
        }
        .profile-card:hover .profile-name {
            color: #fff;
        }

        header {
            background-color: #000;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 2px solid #e50914;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        header h1 {
            color: #e50914;
            font-size: 24px;
            letter-spacing: 1px;
            margin: 0 auto;
        }
        .settings-icon-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            position: absolute;
            right: 0;
        }
        .search-box {
            width: 100%;
            padding: 10px 15px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .container {
            padding: 15px;
            flex-grow: 1;
        }
        .section-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 10px 0;
        }
        .section-title {
            font-size: 17px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-profiles-btn {
            background: #222;
            color: #e50914;
            border: 1px solid #e50914;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-profiles-btn:hover {
            background: #e50914;
            color: #fff;
        }
        
        /* Layout afich yo pi konpakt */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 10px;
        }
        .movie-card {
            background-color: #1f1f1f;
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: scale(1.03);
        }
        .movie-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .movie-info {
            padding: 6px;
            text-align: center;
        }
        .movie-title {
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-views {
            font-size: 10px;
            color: #aaa;
            margin-top: 3px;
        }

        /* Modal Paramèt */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .modal-content {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            padding: 10px 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
            margin-top: 15px;
        }

        /* Lektè Videyo ak Seleksyon Epizòd */
        #player-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 2000;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
        }
        #player-screen video {
            width: 100%;
            max-height: 50vh;
            background: #000;
        }
        .back-btn {
            align-self: flex-start;
            margin: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
        }
        .episodes-box {
            width: 100%;
            padding: 15px;
        }
        .episodes-title {
            font-size: 15px;
            margin-bottom: 10px;
            color: #e50914;
        }
        .episode-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #222;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            text-align: left;
            cursor: pointer;
        }
        .episode-btn:hover {
            background: #e50914;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 13px;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <!-- Animasyon Ouvèti Netflix Lakay -->
    <div id="splash-screen">
        <div class="splash-logo">NETFLIX LAKAY</div>
    </div>

    <!-- Ekran Who's Watching? ki gen 3 Pwofil sèlman -->
    <div id="profile-screen">
        <div class="profile-screen-title">Who's Watching?</div>
        <div class="profiles-grid">
            <div class="profile-card" onclick="selectProfile('other')">
                <div class="profile-avatar" style="background-color: #e50914;">🎬</div>
                <div class="profile-name">1: Lòt Fim</div>
            </div>
            <div class="profile-card" onclick="selectProfile('haitian')">
                <div class="profile-avatar" style="background-color: #b81d24;">🇭🇹</div>
                <div class="profile-name">2: Film Haïtien</div>
            </div>
            <div class="profile-card" onclick="selectProfile('series')">
                <div class="profile-avatar" style="background-color: #221f1f; border: 2px solid #555;">📺</div>
                <div class="profile-name">3: Seri</div>
            </div>
        </div>
    </div>

    <header>
        <div class="header-top">
            <h1>Netflix Lakay</h1>
            <button class="settings-icon-btn" onclick="openSettings()">⚙️</button>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Chache yon fim oswa seri..." onkeyup="filterContent()">
    </header>

    <div class="container">
        <!-- Seksyon Lòt Fim -->
        <div id="section-other">
            <div class="section-header-bar">
                <h2 class="section-title">Lòt Fim 🎥</h2>
                <button class="back-profiles-btn" onclick="showProfiles()">⬅ Chanje Pwofil</button>
            </div>
            <div class="movies-grid" id="otherMoviesGrid"></div>
        </div>

        <!-- Seksyon Film Haïtien 🇭🇹 -->
        <div id="section-haitian">
            <div class="section-header-bar">
                <h2 class="section-title">Film Haïtien 🇭🇹</h2>
                <button class="back-profiles-btn" onclick="showProfiles()">⬅ Chanje Pwofil</button>
            </div>
            <div class="movies-grid" id="haitianMoviesGrid"></div>
        </div>

        <!-- Seksyon Seri -->
        <div id="section-series">
            <div class="section-header-bar">
                <h2 class="section-title">Séries 📺</h2>
                <button class="back-profiles-btn" onclick="showProfiles()">⬅ Chanje Pwofil</button>
            </div>
            <div class="movies-grid" id="seriesGrid"></div>
        </div>
    </div>

    <!-- Modal Settings ak Enfòmasyon WhatsApp -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="color:#e50914; margin-bottom:10px;">Paramèt</h3>
            <p style="font-size:13px; color:#ccc; line-height: 1.5;">Si w vle ajoute yon fim, ekri m sou WhatsApp.</p>
            <a href="https://wa.me/50942365530?text=Salitasyon,%20mwen%20vle%20ajoute%20yon%20fim%20sou%20Netflix%20Lakay" class="whatsapp-btn" target="_blank">
                💬 Ekri m sou WhatsApp
            </a>
            <br><br>
            <button onclick="closeSettings()" style="padding:8px 15px; background:#333; color:#fff; border:none; border-radius:4px; width: 100%; cursor:pointer;">Fèmen</button>
        </div>
    </div>

    <!-- Player / Écran Lecture -->
    <div id="player-screen">
        <button class="back-btn" onclick="closePlayer()">⬅ Retounen</button>
        <video id="mainVideo" controls playsinline></video>
        <div class="episodes-box" id="episodesBox"></div>
    </div>

    <footer>
        App Créé par P-52 Art
    </footer>

    <script>
        function selectProfile(type) {
            document.getElementById('profile-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('profile-screen').style.display = 'none';
            }, 500);

            document.getElementById('section-other').style.display = (type === 'other') ? 'block' : 'none';
            document.getElementById('section-haitian').style.display = (type === 'haitian') ? 'block' : 'none';
            document.getElementById('section-series').style.display = (type === 'series') ? 'block' : 'none';
        }

        function showProfiles() {
            document.getElementById('profile-screen').style.display = 'flex';
            document.getElementById('profile-screen').style.opacity = '1';
        }

        /* Done Fim yo ak kantite Vues yo */
        let otherMovies = [];
        let haitianMovies = [];
        let seriesList = [];

        function renderAll() {
            const oGrid = document.getElementById('otherMoviesGrid');
            const hGrid = document.getElementById('haitianMoviesGrid');
            const sGrid = document.getElementById('seriesGrid');
            
            oGrid.innerHTML = otherMovies.length === 0 ? '<p style="color:#666; font-size:12px;">Poko gen fim nan seksyon sa a.</p>' : '';
            hGrid.innerHTML = haitianMovies.length === 0 ? '<p style="color:#666; font-size:12px;">Poko gen fim nan seksyon sa a.</p>' : '';
            sGrid.innerHTML = seriesList.length === 0 ? '<p style="color:#666; font-size:12px;">Poko gen seri nan seksyon sa a.</p>' : '';

            otherMovies.forEach((m, i) => {
                if(!m.views) m.views = 0;
                oGrid.innerHTML += `
                    <div class="movie-card" onclick="playOtherMovie(${i})">
                        <img src="${m.poster}" alt="${m.title}">
                        <div class="movie-info">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-views">👁️ ${m.views} vues</div>
                        </div>
                    </div>
                `;
            });

            haitianMovies.forEach((m, i) => {
                if(!m.views) m.views = 0;
                hGrid.innerHTML += `
                    <div class="movie-card" onclick="playHaitianMovie(${i})">
                        <img src="${m.poster}" alt="${m.title}">
                        <div class="movie-info">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-views">👁️ ${m.views} vues</div>
                        </div>
                    </div>
                `;
            });

            seriesList.forEach((s, i) => {
                if(!s.views) s.views = 0;
                sGrid.innerHTML += `
                    <div class="movie-card" onclick="openSeries(${i})">
                        <img src="${s.poster}" alt="${s.title}">
                        <div class="movie-info">
                            <div class="movie-title">${s.title}</div>
                            <div class="movie-views">👁️ ${s.views} vues</div>
                        </div>
                    </div>
                `;
            });
        }

        const videoPlayer = document.getElementById('mainVideo');

        function playOtherMovie(i) {
            otherMovies[i].views++;
            renderAll();
            document.getElementById('episodesBox').innerHTML = '';
            videoPlayer.src = otherMovies[i].video;
            document.getElementById('player-screen').style.display = 'flex';
            videoPlayer.play();
        }

        function playHaitianMovie(i) {
            haitianMovies[i].views++;
            renderAll();
            document.getElementById('episodesBox').innerHTML = '';
            videoPlayer.src = haitianMovies[i].video;
            document.getElementById('player-screen').style.display = 'flex';
            videoPlayer.play();
        }

        function openSeries(i) {
            seriesList[i].views++;
            renderAll();
            const series = seriesList[i];
            const epBox = document.getElementById('episodesBox');
            epBox.innerHTML = `<h3 class="episodes-title">${series.title} - Épisodes</h3>`;
            
            series.episodes.forEach(ep => {
                epBox.innerHTML += `
                    <button class="episode-btn" onclick="playEpisode('${ep.video}')">▶ ${ep.name}</button>
                `;
            });

            videoPlayer.src = series.episodes[0].video;
            document.getElementById('player-screen').style.display = 'flex';
            videoPlayer.play();
        }

        function playEpisode(url) {
            videoPlayer.src = url;
            videoPlayer.play();
        }

        function closePlayer() {
            videoPlayer.pause();
            videoPlayer.src = '';
            document.getElementById('player-screen').style.display = 'none';
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        renderAll();
    </script>
</body>
</html>
